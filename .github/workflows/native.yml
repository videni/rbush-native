name: Native port
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    env:
      RBUSH_PARITY_CLI: ${{ github.workspace }}/build-native/rbush_parity_cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned references outside the repository
        run: node "$GITHUB_WORKSPACE/scripts/fetch-upstream.mjs"
      - run: node "$GITHUB_WORKSPACE/scripts/parity-upstream.mjs" original
      - run: bash "$GITHUB_WORKSPACE/scripts/test-native.sh"
      - run: node "$GITHUB_WORKSPACE/scripts/parity-source.mjs"
      - run: node "$GITHUB_WORKSPACE/scripts/parity-upstream.mjs" native
      - run: node "$GITHUB_WORKSPACE/scripts/parity-sequences.mjs" native
      - run: node "$GITHUB_WORKSPACE/scripts/parity-datasets.mjs" native
  # The root manifest is a thin entry over integrations/swift and the shared core.
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path "$GITHUB_WORKSPACE" --jobs 3
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned references outside the repository
        run: node "$GITHUB_WORKSPACE/scripts/fetch-upstream.mjs"
      - name: Install pinned Emscripten outside the repository
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.20
          echo "EMXX=$RUNNER_TEMP/emsdk/upstream/emscripten/em++" >> "$GITHUB_ENV"
      - run: bash "$GITHUB_WORKSPACE/scripts/wasm-build.sh"
      - run: node "$GITHUB_WORKSPACE/scripts/parity-upstream.mjs" wasm
      - run: node "$GITHUB_WORKSPACE/scripts/parity-sequences.mjs" wasm
      - run: node "$GITHUB_WORKSPACE/scripts/parity-datasets.mjs" wasm
      - run: node --expose-gc "$GITHUB_WORKSPACE/scripts/parity-adapter-regressions.mjs"
